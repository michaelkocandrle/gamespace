[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
; Only these maps and what they reference get cooked...
+MapsToCook=(FilePath="/Game/Maps/MainMenu")
+MapsToCook=(FilePath="/Game/Maps/TestSpace")
; ...but C++ loads many assets by path (input, sounds, materials, meshes), which the cooker cannot
; see. Without these the packaged game had no sound, no H key and no space dust.
+DirectoriesToAlwaysCook=(Path="/Game/Input")
+DirectoriesToAlwaysCook=(Path="/Game/Ships")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Environments")
+DirectoriesToAlwaysCook=(Path="/Game/Planets")
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
; The flight HUD loads its .ttf files straight from disk (importing a Font asset needs a Slate
; application, which the headless editor has not). Raw files under Content are not cooked, so they
; have to be staged as UFS files to end up in the pak. The path is relative to Content/ (it was
; "Content/UI/Fonts", which staged nothing: the packaged HUD fell back to Roboto). Tools/Package.ps1
; checks the fonts are in the build. UI/Fonts/Custom (a font the player drops in) comes along.
+DirectoriesToAlwaysStageAsUFS=(Path="UI/Fonts")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints")
