<title>Wayfarer Sound Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one column of sounds, each a row of takes (the game's sound first), a fixed bar with the choice to paste */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #18202a; --dim: #5d6876; --line: #d3dae2;
  --accent: #1f7fd6; --now: #8a6a2a; --pick: #e6f1fc;
  --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --panel: #18202a; --ink: #e3ebf3; --dim: #8d9aa8; --line: #2a3542;
  --accent: #5fb2ff; --now: #d9b06a; --pick: #16304a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141a; --panel: #18202a; --ink: #e3ebf3; --dim: #8d9aa8; --line: #2a3542;
  --accent: #5fb2ff; --now: #d9b06a; --pick: #16304a; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--display); }
main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 120px; display: grid; gap: 18px; }
h1 { font-size: 1.9rem; font-weight: 600; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.lead { color: var(--dim); max-width: 68ch; margin: 4px 0 0; line-height: 1.45; font-size: 1.02rem; }
.snd { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; }
.snd header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.snd h2 { font-size: 1.25rem; font-weight: 600; margin: 0; }
.snd header p { margin: 0; color: var(--dim); flex: 1 1 260px; min-width: 0; }
.snd code { font-family: var(--mono); font-size: .78rem; color: var(--dim); letter-spacing: .03em; }
.takes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.take { border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.take.now { border-style: dashed; }
.take.now .tl { color: var(--now); }
.take:has(input:checked) { background: var(--pick); border-color: var(--accent); }
.tl { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
audio { width: 100%; height: 36px; }
.pick { font-size: .95rem; display: flex; gap: 6px; align-items: center; cursor: pointer; }
details { font-size: .82rem; color: var(--dim); }
details p { margin: 6px 0 0; font-family: var(--mono); font-size: .74rem; line-height: 1.4; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar output { font-family: var(--mono); font-size: .8rem; flex: 1 1 300px; min-width: 0; overflow-wrap: anywhere; color: var(--dim); }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--panel); border: 0; border-radius: 4px; padding: 8px 16px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<main>
  <div>
    <h1>Wayfarer Sound Board</h1>
    <p class="lead">Ke každému zvuku lodi poslouchej verzi, která je teď ve hře, a tři nové kandidáty. U každého vyber nejlepší; kde se ti nelíbí žádný, nech nevybráno. Výběr dole zkopíruj a pošli do chatu.</p>
  </div>
<!--ROWS-->
</main>
<div class="bar"><output id="sel">Zatím nic nevybráno.</output><button type="button" id="copy">Zkopírovat výběr</button></div>
<script>
const out = document.getElementById("sel");
function summary() {
  const parts = [];
  document.querySelectorAll(".snd").forEach(s => {
    const c = s.querySelector("input:checked");
    parts.push(s.dataset.sound + "=" + (c ? c.value : "-"));
  });
  return parts.join(", ");
}
function refresh() {
  const t = summary();
  out.textContent = t.includes("=") && /=[abc]/.test(t) ? t : "Zatím nic nevybráno.";
  try { localStorage.setItem("wsb", JSON.stringify([...document.querySelectorAll("input:checked")].map(i => i.id))); } catch (e) {}
}
try { (JSON.parse(localStorage.getItem("wsb") || "[]")).forEach(id => { const i = document.getElementById(id); if (i) i.checked = true; }); } catch (e) {}
document.addEventListener("change", refresh);
document.addEventListener("play", e => { document.querySelectorAll("audio").forEach(a => { if (a !== e.target) a.pause(); }); }, true);
document.getElementById("copy").addEventListener("click", () => {
  const t = summary();
  navigator.clipboard.writeText(t).then(() => { out.textContent = "Zkopírováno: " + t; }, () => {
    out.textContent = t; const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});
refresh();
</script>
